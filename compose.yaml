#
# Control node stack: the local registry the Sparks pull from, and the control
# plane that runs the Selene pool manager and answers Orbit commands.
#
#   podman compose -f compose.yaml up -d
#   podman compose -f compose.yaml ps
#   podman compose -f compose.yaml down
#
# The hooks run on the host account, which owns the pool directory and the
# controller identity, so nothing here needs root.
name: flare-control

services:
  registry:
    image: docker.io/library/registry:2
    container_name: flare-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  control-plane:
    image: localhost/flare-control-plane:latest
    container_name: flare-control-plane
    restart: unless-stopped
    # Host networking keeps 9200, 9201 and 9108 on the host, which is what the
    # serving ranks dial.
    network_mode: host
    # io_uring backs the pool's record I/O and the default seccomp profile blocks it.
    security_opt:
      - seccomp=unconfined
    # The pool keeps a 24G DRAM arena in /dev/shm, well past the 64M default.
    shm_size: 32G
    environment:
      SELENE_NAME: ds41
      SELENE_MEMORY: 24G
      SELENE_NVME: 200G
      SELENE_STAGING: 1G
      SELENE_LISTEN: 0.0.0.0:9200
      SELENE_LISTEN_DATA: 0.0.0.0:9201
      SELENE_METRICS: 127.0.0.1:9108
    volumes:
      - ${HOME}/selene-pool:/var/lib/selene
      - ${HOME}/.config/flare:/root/.config/flare:ro
    command: ["selene"]

volumes:
  registry-data:
